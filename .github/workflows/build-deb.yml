name: Build .deb package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential

      - name: Build .deb package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Move build artifacts
        run: |
          mkdir -p dist
          mv ../rufus-linux_*.deb dist/
          mv ../rufus-linux_*.buildinfo dist/ || true
          mv ../rufus-linux_*.changes dist/ || true

      - name: Lint package with lintian
        run: |
          sudo apt-get install -y lintian
          lintian dist/*.deb || true

      - name: Upload .deb as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rufus-linux-deb
          path: dist/*.deb

      - name: Attach .deb to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
